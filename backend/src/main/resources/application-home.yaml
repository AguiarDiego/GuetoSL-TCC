
  spring:
    datasource:
      url: jdbc:sqlserver://localhost:1433;databaseName=guetosl;encrypt=true;trustServerCertificate=true;integratedSecurity=true

    servlet:
      multipart:
        max-file-size: 10MB
        max-request-size: 50MB

  melhor-envio:
    base-url: https://sandbox.melhorenvio.com.br
    client-id: ${MELHOR_ENVIO_CLIENT_ID}
    client-secret: ${MELHOR_ENVIO_CLIENT_SECRET}
    redirect-uri: ${MELHOR_ENVIO_REDIRECT_URI}
